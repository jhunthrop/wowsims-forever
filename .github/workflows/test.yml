# The Forever fork's own gate. It builds no artifact: the Forever Sixty
# site builds sim.wasm and forever-sim from its own sim/ module, which is
# what keeps this repository a clean, upstreamable library. See PORTING.md.
name: test
on:
  push:
    branches: [forever]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache-dependency-path: go.sum }
      - name: protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The generated protobufs are committed (see PORTING.md) because the
      # site consumes this module at a pinned pseudo-version. This
      # regenerates and diffs, so a stale commit fails here rather than in
      # the site's build. The test skips itself if protoc-gen-go is
      # missing, so the step above is what makes it a gate.
      - run: go test --tags=with_db ./sim/core/proto/ -run TestGeneratedProtosMatchSources -v
      # sim/web embeds binary_dist, which is generated and gitignored, so
      # a fresh checkout cannot build - let alone test - ./sim/... until
      # this exists. It has to come BEFORE anything that names ./sim/...:
      # a developer's checkout already has it from an earlier make, so
      # getting the order wrong fails only in CI.
      - run: make binary_dist/dist.go
      - run: go test --tags=with_db -count=1 ./sim/...
      # tools/talentgen holds the generator's own guarantees -
      # TestRegeneratingEveryClassIsByteIdentical,
      # TestUITreeJSONCarriesEveryPrerequisite and
      # TestTalentStringRoundTripsThroughFillTalentsProto among them,
      # over ~11k lines of per-class fixtures. Without this step a hand
      # edit to any of the nine talents_auto_gen.go, the nine .proto
      # talent messages or the nine UI talent JSONs passes green.
      - run: go test --tags=with_db -count=1 ./tools/...
      # The site builds our wasm from its own sim/ module, but the engine
      # must still compile for js/wasm or that build breaks downstream.
      - name: the engine cross-compiles for wasm
        run: GOOS=js GOARCH=wasm go build ./sim/...
      # No gofmt and no `go vet` step. This is a fork of wowsims/classic
      # and its tree is neither: twenty-one upstream files under sim/ are
      # unformatted, and `go vet --tags=with_db ./sim/...` fails on
      # upstream's sim/core/test_generators.go, which copies a protobuf
      # by value. Gating on either would fail on code we did not write,
      # and reformatting it would turn every upstream merge into a
      # conflict - the thing PORTING.md exists to avoid. The Forever code
      # this fork adds is gofmt'd and vetted in review; the site's own
      # sim/ module, which is all our own code, gates both in CI.
